name: Release

# Builds the Windows installer and publishes a GitHub release whenever the
# version in main/package.json changes on master (or when run manually).
# To release: bump "version" in main/package.json and push to master.

on:
  push:
    branches:
      - 'master'
    paths:
      - 'main/package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v6

    - name: Read version
      id: version
      shell: bash
      run: echo "version=$(node -p "require('./main/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Skip if release already exists
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "Release v${{ steps.version.outputs.version }} already exists, nothing to do."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/setup-node@v6
      if: steps.check.outputs.skip == 'false'
      with:
        node-version: 22

    - name: Build renderer
      if: steps.check.outputs.skip == 'false'
      working-directory: ./renderer
      run: |
        npm ci
        npm run build

    - name: Build and publish installer
      if: steps.check.outputs.skip == 'false'
      working-directory: ./main
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        npm ci
        npm run build
        npx electron-builder build --win nsis --x64 --publish always
