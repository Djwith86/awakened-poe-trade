name: Release

# Builds the Windows installer and publishes a GitHub release whenever the
# version in main/package.json changes on master (or when run manually).
# To release: bump "version" in main/package.json and push to master.

on:
  push:
    branches:
      - 'master'
    paths:
      - 'main/package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v6

    - name: Read version
      id: version
      shell: bash
      run: echo "version=$(node -p "require('./main/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Skip if release is already complete
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        assets=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
        if [ -n "$assets" ] || gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi
        if echo "$assets" | grep -qx "latest.yml"; then
          echo "Release v$VERSION already has latest.yml, nothing to do."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/setup-node@v6
      if: steps.check.outputs.skip == 'false'
      with:
        node-version: 22

    - name: Build renderer
      if: steps.check.outputs.skip == 'false'
      working-directory: ./renderer
      run: |
        npm ci
        npm run build

    - name: Build installer
      if: steps.check.outputs.skip == 'false'
      working-directory: ./main
      run: |
        npm ci
        npm run build
        npx electron-builder build --win nsis --x64 --publish never

    - name: Create tag and publish release
      if: steps.check.outputs.skip == 'false'
      shell: bash
      working-directory: ./main/dist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        files=("Awakened.PoE.Trade.Setup.$VERSION.exe" "Awakened.PoE.Trade.Setup.$VERSION.exe.blockmap" latest.yml)
        if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
          # release was created by hand or by an earlier failed run: fill in the files
          gh release upload "v$VERSION" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
        else
          gh release create "v$VERSION" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            --latest
        fi
